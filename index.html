<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Task Dashboard</title>
<style>
body { font-family: Arial; background:#f5f6fa; margin:20px; }
h1 { color:#2f3640; }
select,input,button { padding:6px; margin:4px; }
table { width:100%; border-collapse: collapse; margin-top:15px; }
th,td{border:1px solid #dcdde1; padding:8px; text-align:left;}
th{background:#273c75;color:white;}
tr:nth-child(even){background:#f1f2f6;}
button{background:#44bd32;color:white;border:none;border-radius:4px;cursor:pointer;}
button:disabled{background:#aaa;cursor:not-allowed;}
</style>
</head>
<body>

<h1>Team Task Dashboard</h1>

<p>Select your name:</p>
<select id="userSelect"><option value="">-- Select User --</option></select>

<p>Filters:</p>
Status:
<select id="statusFilter">
<option value="All">All</option>
<option value="To Do">To Do</option>
<option value="In Progress">In Progress</option>
<option value="Completed">Completed</option>
</select>
Assigned To:
<select id="assignedFilter"><option value="All">All</option></select>
Date Range:
<input type="date" id="startDate"> to <input type="date" id="endDate">

<div id="addTaskDiv" style="margin-top:10px; display:none;">
<h3>Add Task</h3>
Task Description: <input type="text" id="taskDesc"><br>
Assigned To (comma-separated names): <input type="text" id="taskAssigned"><br>
Deadline: <input type="date" id="taskDeadline"><br>
Remarks: <input type="text" id="taskRemarks"><br>
<button onclick="addTask()">Add Task</button>
</div>

<table id="taskTable">
<thead>
<tr>
<th>Task Description</th>
<th>Assigned Date</th>
<th>Deadline</th>
<th>Status</th>
<th>Completion Date</th>
<th>Remarks</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
const webAppUrl = "https://script.google.com/macros/s/AKfycbyjjJf2dAHpUnVHf5FF_yrI5j-Jini3XdspFAg332rKRaNDD9K7siIAGjQlasCPCwas/exec";

// Define members and admins
const admins = ["Sneha","Ice"];
const members = ["Sneha","Shobha","Ice","Soso","Virus"];
let userName = "";
let allTasks = [];

async function fetchTasks(){
  try{
    const res = await fetch(`https://opensheet.elk.sh/1D1e_PSZilgAZmsmxbyKFdgQpXrMdgKreoynjdGt5wy8/Tasks`);
    allTasks = await res.json();
    displayTasks();
  }catch(err){ console.log("Error fetching tasks", err); }
}

function updateAddTaskVisibility(){
  document.getElementById("addTaskDiv").style.display = admins.includes(userName) ? "block" : "none";
}

function displayTasks(){
  const tbody = document.querySelector("#taskTable tbody");
  tbody.innerHTML = "";

  const statusVal = document.getElementById("statusFilter").value;
  const assignedVal = document.getElementById("assignedFilter").value;
  const startDate = document.getElementById("startDate").value;
  const endDate = document.getElementById("endDate").value;

  let filtered = allTasks.filter(task=>{
    const assignedList = task["Assigned To"].split(",").map(x=>x.trim());
    const isAssigned = admins.includes(userName) || assignedList.includes(userName);
    const statusMatch = statusVal==="All" || task.Status===statusVal;
    const assignedMatch = assignedVal==="All" || assignedList.includes(assignedVal);
    const startMatch = !startDate || new Date(task["Assigned Date"])>=new Date(startDate);
    const endMatch = !endDate || new Date(task["Assigned Date"])<=new Date(endDate);
    return isAssigned && statusMatch && assignedMatch && startMatch && endMatch;
  });

  filtered.sort((a,b)=>new Date(a["Assigned Date"])-new Date(b["Assigned Date"]));

  filtered.forEach(task=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${task["Task Description"]}</td>
      <td>${task["Assigned Date"]}</td>
      <td>${task.Deadline}</td>
      <td>${task.Status}</td>
      <td>${task["Completion Date"]||""}</td>
      <td>${task.Remarks||""}</td>
      <td>${task.Status==="Completed"?"✅":
      `<button onclick="updateTask('${task.ID}','In Progress')">In Progress</button>
       <button onclick="updateTask('${task.ID}','Completed')">Complete</button>`}</td>`;
    tbody.appendChild(tr);
  });
}

async function updateTask(taskId,status){
  await fetch(webAppUrl,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action:"update",ID:taskId,Status:status})
  });
  fetchTasks();
}

async function addTask(){
  const desc = document.getElementById("taskDesc").value.trim();
  const assigned = document.getElementById("taskAssigned").value.trim();
  const deadline = document.getElementById("taskDeadline").value;
  const remarks = document.getElementById("taskRemarks").value.trim();
  if(!desc || !assigned){ alert("Task Description and Assigned To required"); return; }

  const today = new Date();
  const assignedDate = today.toISOString().split("T")[0];

  try{
    const res = await fetch(webAppUrl,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        action:"add",
        TaskDescription: desc,
        AssignedDate: assignedDate,
        AssignedTo: assigned,
        Deadline: deadline,
        Status: "To Do",
        CompletionDate: "",
        Remarks: remarks
      })
    });
    const result = await res.json();
    if(result.status==="success"){
      document.getElementById("taskDesc").value="";
      document.getElementById("taskAssigned").value="";
      document.getElementById("taskDeadline").value="";
      document.getElementById("taskRemarks").value="";
      fetchTasks();
    }else{ alert("Error adding task"); }
  }catch(err){ alert("Server connection error: "+err); }
}

// Populate user dropdown
const userSelect = document.getElementById("userSelect");
members.forEach(m => userSelect.appendChild(new Option(m,m)));
const assignedFilter = document.getElementById("assignedFilter");
members.forEach(m => assignedFilter.appendChild(new Option(m,m)));

userSelect.addEventListener("change", e=>{
  userName = e.target.value;
  updateAddTaskVisibility();
  fetchTasks();
});

document.getElementById("statusFilter").addEventListener("change", displayTasks);
document.getElementById("assignedFilter").addEventListener("change", displayTasks);
document.getElementById("startDate").addEventListener("change", displayTasks);
document.getElementById("endDate").addEventListener("change", displayTasks);

// Initial load
fetchTasks();
</script>

</body>
</html>
