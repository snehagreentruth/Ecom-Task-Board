<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Com Task Board</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f6fa;
      margin: 20px;
    }
    h1 {
      color: #2f3640;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #dcdde1;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #273c75;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f1f2f6;
    }
    button {
      background-color: #44bd32;
      color: white;
      border: none;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 4px;
    }
    button:disabled {
      background-color: #aaa;
    }
    .completed {
      color: green;
      font-weight: bold;
    }
    .pending {
      color: orange;
    }
  </style>
</head>
<body>
  <h1>E-Com Task Board</h1>
  <p>Select your email to view your tasks:</p>
  <select id="userEmail">
    <option value="">-- Select User --</option>
  </select>

  <table id="taskTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Task Description</th>
        <th>Assigned Date</th>
        <th>Deadline</th>
        <th>Status</th>
        <th>Remarks</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    // Your Google Sheet info
    const sheetId = "PASTE_YOUR_SHEET_ID_HERE"; // replace with your Google Sheet ID
    const sheetName = "Tasks";
    const apiUrl = `https://opensheet.elk.sh/${1D1e_PSZilgAZmsmxbyKFdgQpXrMdgKreoynjdGt5wy8}/${Tasks}`;

    // Your Google Apps Script Web App URL
    const webAppUrl = "https://script.google.com/macros/s/AKfycbzjQMjZ4w4QDPFZLAzJ6sxkx3YwluiYle_ChMvmD81xNm9TcGkmLr08x6e89k4ZwE9q/exec";

    let userEmail = "";

    // Fetch tasks from Google Sheet
    async function fetchTasks() {
      const res = await fetch(apiUrl);
      const data = await res.json();

      // Populate user dropdown dynamically
      const users = new Set();
      data.forEach(task => {
        if (task["Assigned To"]) {
          task["Assigned To"].split(",").forEach(email => users.add(email.trim()));
        }
      });

      const userSelect = document.getElementById("userEmail");
      userSelect.innerHTML = '<option value="">-- Select User --</option>'; // reset
      users.forEach(email => {
        const opt = document.createElement("option");
        opt.value = email;
        opt.textContent = email;
        userSelect.appendChild(opt);
      });

      userSelect.addEventListener("change", (e) => {
        userEmail = e.target.value;
        displayTasks(data);
      });
    }

    // Display tasks for the selected user
    function displayTasks(tasks) {
      const tbody = document.querySelector("#taskTable tbody");
      tbody.innerHTML = "";

      tasks.forEach(task => {
        const assignedList = task["Assigned To"].split(",").map(e => e.trim());
        if (userEmail && assignedList.includes(userEmail)) {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${task.ID}</td>
            <td>${task["Task Description"]}</td>
            <td>${task["Assigned Date"]}</td>
            <td>${task["Deadline"]}</td>
            <td class="${task.Status === "Completed" ? "completed" : "pending"}">${task.Status}</td>
            <td>${task.Remarks || ""}</td>
            <td>
              ${task.Status === "Completed" ? "✅" : `<button onclick="markComplete('${task.ID}')">Mark Complete</button>`}
            </td>
          `;
          tbody.appendChild(row);
        }
      });
    }

    // Function to mark a task as completed via Google Apps Script Web App
    async function markComplete(taskId) {
      const payload = {
        ID: taskId,
        Status: "Completed",
        CompletionDate: new Date().toLocaleDateString()
      };

      try {
        const res = await fetch(webAppUrl, {
          method: "POST",
          body: JSON.stringify(payload),
          headers: { "Content-Type": "application/json" }
        });
        const data = await res.json();
        if (data.result === "success") {
          alert("Task marked as completed!");
          fetchTasks(); // Refresh table
        }
      } catch (error) {
        alert("Error updating task. Check console.");
        console.error(error);
      }
    }

    // Initial fetch
    fetchTasks();
  </script>
</body>
</html>
