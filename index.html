<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Task Dashboard</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f6f8fa;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
    color: #333;
  }
  .container {
    max-width: 1000px;
    margin: 0 auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px #ccc;
  }
  label {
    font-weight: bold;
  }
  select, input, textarea {
    padding: 8px;
    margin: 5px 0;
    width: 100%;
    box-sizing: border-box;
  }
  button {
    background: #28a745;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
  }
  button:hover {
    background: #218838;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }
  table th, table td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
  }
  table th {
    background: #f2f2f2;
  }
  .filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Team Task Dashboard</h1>

  <div class="filters">
    <div>
      <label for="assignedFilter">Filter by Assigned To:</label>
      <select id="assignedFilter">
        <option value="All">All</option>
        <option value="Sneha">Sneha</option>
        <option value="Shobha">Shobha</option>
        <option value="Ice">Ice</option>
        <option value="Soso">Soso</option>
        <option value="Virus">Virus</option>
      </select>
    </div>

    <div>
      <label for="statusFilter">Filter by Status:</label>
      <select id="statusFilter">
        <option value="All">All</option>
        <option value="To Do">To Do</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
      </select>
    </div>

    <div>
      <label>Date From:</label>
      <input type="date" id="fromDate" />
    </div>

    <div>
      <label>Date To:</label>
      <input type="date" id="toDate" />
    </div>
  </div>

  <h3>Add New Task</h3>
  <input type="text" id="taskDescription" placeholder="Task Description" />
  <input type="date" id="assignedDate" />
  <input type="text" id="assignedTo" placeholder="Assigned To (comma-separated names)" />
  <input type="date" id="deadline" />
  <select id="status">
    <option value="To Do">To Do</option>
    <option value="In Progress">In Progress</option>
    <option value="Completed">Completed</option>
  </select>
  <textarea id="remarks" placeholder="Remarks (optional)"></textarea>
  <button onclick="addTask()">Add Task</button>

  <table id="taskTable">
    <thead>
      <tr>
        <th>Task Description</th>
        <th>Assigned Date</th>
        <th>Deadline</th>
        <th>Status</th>
        <th>Completion Date</th>
        <th>Remarks</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyr1Vz6JW1YA4_KJXuxLU_xbrd38723j6bWgurEqI6dvZmqI4-gUjLA2J6ZfscKOSxG/exec";

async function addTask() {
  const taskDescription = document.getElementById("taskDescription").value.trim();
  const assignedDate = document.getElementById("assignedDate").value;
  const assignedTo = document.getElementById("assignedTo").value.trim();
  const deadline = document.getElementById("deadline").value;
  const status = document.getElementById("status").value;
  const remarks = document.getElementById("remarks").value.trim();

  if (!taskDescription || !assignedDate || !assignedTo || !deadline) {
    alert("Please fill in all required fields.");
    return;
  }

  const payload = {
    action: "addTask",
    taskDescription,
    assignedDate,
    assignedTo,
    deadline,
    status,
    remarks
  };

  try {
    const response = await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const result = await response.json();
    if (result.success) {
      alert("Task added successfully!");
      loadTasks();
      document.querySelectorAll("input, textarea").forEach(el => el.value = "");
    } else {
      alert("Error: " + (result.error || "Unknown issue"));
    }
  } catch (error) {
    alert("Server connection error!");
    console.error(error);
  }
}

async function loadTasks() {
  // Optional: fetch existing tasks from Google Sheets if you implement doGet()
}

document.addEventListener("DOMContentLoaded", loadTasks);
</script>
</body>
</html>
