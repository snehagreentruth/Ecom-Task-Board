<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Task Dashboard</title>
<style>
body { font-family: Arial, sans-serif; background: #f5f6fa; margin: 20px; }
h1 { color: #2f3640; }
select, input, button { padding: 6px; margin: 4px; }
table { width: 100%; border-collapse: collapse; margin-top: 15px; }
th, td { border: 1px solid #dcdde1; padding: 8px; text-align: left; }
th { background: #273c75; color: white; }
tr:nth-child(even) { background: #f1f2f6; }
button { background: #44bd32; color: white; border: none; border-radius: 4px; cursor: pointer; }
button:disabled { background: #aaa; cursor: not-allowed; }
.completed { color: green; font-weight: bold; }
.inprogress { color: orange; font-weight: bold; }
</style>
</head>
<body>
<h1>Team Task Dashboard</h1>

<!-- User selection -->
<p>Select your name:</p>
<select id="userSelect"><option value="">-- Select User --</option></select>

<!-- Filters -->
<p>Filter:</p>
Status:
<select id="statusFilter">
  <option value="All">All</option>
  <option value="To Do">To Do</option>
  <option value="In Progress">In Progress</option>
  <option value="Completed">Completed</option>
</select>
Assigned To:
<select id="assignedFilter"><option value="All">All</option></select>
Date Range:
<input type="date" id="startDate"> to <input type="date" id="endDate">

<!-- Add Task Section -->
<div id="addTaskDiv" style="margin-top:10px;">
<h3>Add Task</h3>
Task Description: <input type="text" id="taskDesc">
Assigned To (comma-separated names): <input type="text" id="taskAssigned">
Deadline: <input type="date" id="taskDeadline">
Remarks: <input type="text" id="taskRemarks">
<button onclick="addTask()">Add Task</button>
</div>

<!-- Task Table -->
<table id="taskTable">
<thead>
<tr>
<th>Task Description</th>
<th>Assigned Date</th>
<th>Deadline</th>
<th>Status</th>
<th>Completion Date</th>
<th>Remarks</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
const sheetId = "1D1e_PSZilgAZmsmxbyKFdgQpXrMdgKreoynjdGt5wy8"; 
const webAppUrl = "https://script.google.com/macros/s/AKfycbwxbTTGacG-RNGExoETgdcInviDQeeqlq4yvNrsccbNUHyiqvBS1k34N0yuZrRXwmpA/exec";
const admins = ["Sneha","Ice"];
let userName = "";
let allTasks = [];

// Fetch tasks
async function fetchTasks(){
  const res = await fetch(`https://opensheet.elk.sh/${sheetId}/Tasks`);
  allTasks = await res.json();
  populateUserDropdown();
  displayTasks();
}

// Populate user dropdowns
function populateUserDropdown(){
  const users = new Set();
  allTasks.forEach(t => t["Assigned To"].split(",").map(x=>x.trim()).forEach(u=>users.add(u)));
  const userSelect = document.getElementById("userSelect");
  userSelect.innerHTML = '<option value="">-- Select User --</option>';
  users.forEach(u=>userSelect.appendChild(new Option(u,u)));

  const assignedFilter = document.getElementById("assignedFilter");
  assignedFilter.innerHTML = '<option value="All">All</option>';
  users.forEach(u=>assignedFilter.appendChild(new Option(u,u)));
}

// Display tasks in table
function displayTasks(){
  const tbody = document.querySelector("#taskTable tbody");
  tbody.innerHTML = "";
  const statusVal = document.getElementById("statusFilter").value;
  const assignedVal = document.getElementById("assignedFilter").value;
  const startDate = document.getElementById("startDate").value;
  const endDate = document.getElementById("endDate").value;

  let filtered = allTasks.filter(task=>{
    const assignedList = task["Assigned To"].split(",").map(x=>x.trim());
    const isAssigned = admins.includes(userName) || assignedList.includes(userName);
    const statusMatch = statusVal==="All" || task.Status===statusVal;
    const assignedMatch = assignedVal==="All" || assignedList.includes(assignedVal);
    const startMatch = !startDate || new Date(task["Assigned Date"]) >= new Date(startDate);
    const endMatch = !endDate || new Date(task["Assigned Date"]) <= new Date(endDate);
    return isAssigned && statusMatch && assignedMatch && startMatch && endMatch;
  });

  filtered.sort((a,b)=> new Date(a["Assigned Date"]) - new Date(b["Assigned Date"]));

  filtered.forEach(task=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${task["Task Description"]}</td>
      <td>${task["Assigned Date"]}</td>
      <td>${task.Deadline}</td>
      <td>${task.Status}</td>
      <td>${task["Completion Date"]||""}</td>
      <td>${task.Remarks||""}</td>
      <td>
        ${task.Status==="Completed"?"✅":
          `<button onclick="confirmUpdate('${task.ID}','In Progress')">In Progress</button>
           <button onclick="confirmUpdate('${task.ID}','Completed')">Complete</button>`}
      </td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById("addTaskDiv").style.display = admins.includes(userName) ? "block" : "none";
}

// Confirmation popup before status update
function confirmUpdate(taskId, status){
  if(status==="Completed"){
    if(!confirm("Mark this task as Completed?")) return;
  }
  updateTask(taskId,status);
}

// Update Task
async function updateTask(taskId, status){
  await fetch(webAppUrl,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({action:"update", ID:taskId, Status:status})
  });
  fetchTasks();
}

// Add Task
async function addTask(){
  const desc = document.getElementById("taskDesc").value;
  const assigned = document.getElementById("taskAssigned").value;
  const deadline = document.getElementById("taskDeadline").value;
  const remarks = document.getElementById("taskRemarks").value;

  if(!desc || !assigned){ alert("Task Description and Assigned To required"); return; }

  await fetch(webAppUrl,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"add",
      TaskDescription:desc,
      AssignedTo:assigned,
      Deadline:deadline,
      Remarks:remarks
    })
  });

  document.getElementById("taskDesc").value="";
  document.getElementById("taskAssigned").value="";
  document.getElementById("taskDeadline").value="";
  document.getElementById("taskRemarks").value="";

  fetchTasks();
}

// Event listeners
document.getElementById("userSelect").addEventListener("change", e=>{ userName=e.target.value; displayTasks(); });
document.getElementById("statusFilter").addEventListener("change", displayTasks);
document.getElementById("assignedFilter").addEventListener("change", displayTasks);
document.getElementById("startDate").addEventListener("change", displayTasks);
document.getElementById("endDate").addEventListener("change", displayTasks);

fetchTasks();
</script>
</body>
</html>
