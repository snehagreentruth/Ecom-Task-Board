<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Task Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    .filters, .add-task {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    label {
      font-weight: bold;
    }
    select, input, textarea, button {
      padding: 6px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      background: #2ecc71;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #27ae60;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background: #2c3e50;
      color: white;
    }
    tr:hover {
      background: #f1f1f1;
    }
    .status {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Team Task Dashboard</h1>

  <div class="filters">
    <label for="filterStatus">Filter by Status:</label>
    <select id="filterStatus" onchange="filterTasks()">
      <option value="All">All</option>
      <option value="To Do">To Do</option>
      <option value="In Progress">In Progress</option>
      <option value="Completed">Completed</option>
    </select>

    <label for="filterMember">Filter by Assigned To:</label>
    <select id="filterMember" onchange="filterTasks()">
      <option value="All">All</option>
      <option value="Sneha">Sneha</option>
      <option value="Shobha">Shobha</option>
      <option value="Ice">Ice</option>
      <option value="Soso">Soso</option>
      <option value="Virus">Virus</option>
    </select>

    <label for="filterStart">From:</label>
    <input type="date" id="filterStart" onchange="filterTasks()" />
    <label for="filterEnd">To:</label>
    <input type="date" id="filterEnd" onchange="filterTasks()" />
  </div>

  <div class="add-task">
    <h3>Add Task</h3>
    <label>Assigned Date:</label>
    <input type="date" id="assignedDate" />

    <label>Task Description:</label>
    <input type="text" id="taskDescription" placeholder="Enter task description" size="40" />

    <label>Assigned To (names, comma separated):</label>
    <input type="text" id="assignedTo" placeholder="e.g., Sneha, Shobha" />

    <label>Deadline:</label>
    <input type="date" id="deadline" />

    <label>Status:</label>
    <select id="status">
      <option value="To Do">To Do</option>
      <option value="In Progress">In Progress</option>
      <option value="Completed">Completed</option>
    </select>

    <label>Remarks:</label>
    <input type="text" id="remarks" placeholder="Optional remarks" />

    <button onclick="addTask()">Add Task</button>
  </div>

  <table id="taskTable">
    <thead>
      <tr>
        <th>Task Description</th>
        <th>Assigned Date</th>
        <th>Deadline</th>
        <th>Status</th>
        <th>Completion Date</th>
        <th>Remarks</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbwVHdGlQKfJ4z-tNTANIBDmNdt8Biz2Vny9CpmtyefTbKWxCm1LaXBi81ZO-B7T3Y7C/exec";
    let tasks = [];

    async function loadTasks() {
      try {
        const res = await fetch(webAppUrl);
        const data = await res.json();
        tasks = data.tasks || [];
        renderTasks(tasks);
      } catch (err) {
        console.error("Error loading tasks:", err);
      }
    }

    async function addTask() {
      const task = {
        action: "add",
        AssignedDate: document.getElementById("assignedDate").value,
        TaskDescription: document.getElementById("taskDescription").value,
        AssignedTo: document.getElementById("assignedTo").value,
        Deadline: document.getElementById("deadline").value,
        Status: document.getElementById("status").value,
        Remarks: document.getElementById("remarks").value,
      };

      if (!task.TaskDescription || !task.AssignedDate || !task.AssignedTo) {
        alert("Please fill required fields (Assigned Date, Description, Assigned To).");
        return;
      }

      try {
        const res = await fetch(webAppUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(task),
        });
        const result = await res.json();
        if (result.status === "success") {
          alert("Task added successfully!");
          loadTasks();
        } else {
          alert("Failed to add task.");
        }
      } catch (err) {
        console.error("Error adding task:", err);
        alert("Server connection error!");
      }
    }

    function renderTasks(list) {
      const tbody = document.querySelector("#taskTable tbody");
      tbody.innerHTML = "";
      list.forEach(task => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${task[1]}</td>
          <td>${task[2]}</td>
          <td>${task[4]}</td>
          <td class="status">${task[5]}</td>
          <td>${task[6] || ""}</td>
          <td>${task[7] || ""}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function filterTasks() {
      const status = document.getElementById("filterStatus").value;
      const member = document.getElementById("filterMember").value;
      const start = document.getElementById("filterStart").value;
      const end = document.getElementById("filterEnd").value;

      let filtered = tasks;
      if (status !== "All") filtered = filtered.filter(t => t[5] === status);
      if (member !== "All") filtered = filtered.filter(t => t[3].includes(member));
      if (start) filtered = filtered.filter(t => new Date(t[2]) >= new Date(start));
      if (end) filtered = filtered.filter(t => new Date(t[2]) <= new Date(end));
      renderTasks(filtered);
    }

    loadTasks();
  </script>
</body>
</html>
