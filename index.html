<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Task Board</title>
<style>
body { font-family: Arial; margin:20px; }
input, select, button { margin:5px; }
table { border-collapse: collapse; width:100%; margin-top:10px; }
th, td { border:1px solid #ccc; padding:5px; text-align:left; }
</style>
</head>
<body>
<h1>Task Board</h1>

<div>
  <label for="filterUser">Filter User:</label>
  <select id="filterUser">
    <option value="">All</option>
    <option>Sneha</option><option>Shobha</option><option>Ice</option><option>Soso</option><option>Virus</option><option>Carl</option>
  </select>

  <label for="filterStatus">Filter Status:</label>
  <select id="filterStatus">
    <option value="">All</option>
    <option>To Do</option><option>In Progress</option><option>Completed</option>
  </select>

  <label for="filterFrom">Date From:</label>
  <input type="date" id="filterFrom">

  <label for="filterTo">Date To:</label>
  <input type="date" id="filterTo">

  <button onclick="renderTasks()">Apply Filters</button>
</div>

<hr>
<h2>Add / Edit Task</h2>
<form id="taskForm">
  <input type="hidden" id="taskID">
  
  <label for="desc">Task Description:</label>
  <input type="text" id="desc"><br>

  <label for="assignedTo">Assigned To:</label>
  <select id="assignedTo">
    <option>Sneha</option><option>Shobha</option><option>Ice</option><option>Soso</option><option>Virus</option><option>Carl</option>
  </select><br>

  <label for="assignedDate">Assigned Date:</label>
  <input type="date" id="assignedDate"><br>

  <label for="deadline">Deadline:</label>
  <input type="date" id="deadline"><br>

  <label for="status">Status:</label>
  <select id="status">
    <option>To Do</option><option>In Progress</option><option>Completed</option>
  </select><br>

  <button type="button" onclick="saveTask()">Save Task</button>
</form>

<hr>
<h2>Tasks</h2>
<table id="tasksTable">
  <thead>
    <tr>
      <th>ID</th><th>Description</th><th>Assigned Date</th><th>Assigned To</th>
      <th>Deadline</th><th>Status</th><th>Completion Date</th><th>Remarks</th><th>Meeting Notes</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqy_ojuWOofqm_DQVvRHmI7pmsKaVckCTGIoKANYRYSJi3d5mqRSZ6O73urTmcLkzA/exec";

async function fetchTasks() {
  const res = await fetch(SCRIPT_URL);
  const text = await res.text();
  try { return JSON.parse(text); } 
  catch(e){ console.error("Error fetching tasks:", e); return []; }
}

async function renderTasks() {
  const tasks = await fetchTasks();
  const tbody = document.querySelector('#tasksTable tbody');
  tbody.innerHTML = '';

  const userFilter = document.getElementById('filterUser').value;
  const statusFilter = document.getElementById('filterStatus').value;
  const from = document.getElementById('filterFrom').value;
  const to = document.getElementById('filterTo').value;

  tasks.forEach(task => {
    let show = true;
    if(userFilter && task['Assigned To'] !== userFilter) show = false;
    if(statusFilter && task['Status'] !== statusFilter) show = false;
    if(from && new Date(task['Assigned Date']) < new Date(from)) show = false;
    if(to && new Date(task['Assigned Date']) > new Date(to)) show = false;
    if(show){
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${task.ID}</td>
                      <td>${task['Task Description']}</td>
                      <td>${task['Assigned Date']}</td>
                      <td>${task['Assigned To']}</td>
                      <td>${task.Deadline}</td>
                      <td>${task.Status}</td>
                      <td>${task['Completion Date']}</td>
                      <td>${task.Remarks}</td>
                      <td>${task['Meeting Notes'] || ''}</td>`;
      tbody.appendChild(tr);
    }
  });
}

async function saveTask(){
  const taskID = document.getElementById('taskID').value;
  const task = {
    ID: taskID,
    'Task Description': document.getElementById('desc').value,
    'Assigned To': document.getElementById('assignedTo').value,
    'Assigned Date': document.getElementById('assignedDate').value,
    'Deadline': document.getElementById('deadline').value,
    'Status': document.getElementById('status').value
  };

  const res = await fetch(SCRIPT_URL, {
    method:'POST',
    body: JSON.stringify({action:'saveTask', task}),
    headers:{'Content-Type':'application/json'}
  });
  const result = await res.json();
  renderTasks();
}

// Load tasks on page load
renderTasks();
</script>
</body>
</html>
